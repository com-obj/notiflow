# Preserve the Spring Integration 5.4 behavior: a failure in the error flow
# must propagate to the gateway instead of being suppressed by errorChannel.
spring.integration.channels.error.ignoreFailures=false
# The existing messaging gateways, producers and routers waited indefinitely.
# Integration 6.1+ otherwise changes those default send/reply waits to 30 seconds.
spring.integration.endpoints.defaultTimeout=-1
