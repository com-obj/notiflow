plugins {
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'maven-publish'
	id 'com.google.cloud.artifactregistry.gradle-plugin' version '2.2.0'
	id 'com.palantir.git-version' version '5.1.0'
	id 'java-library'	
	id 'io.freefair.lombok' version '9.1.0'
//	id 'org.asciidoctor.jvm.convert' version '3.3.0'
}

/*
configurations {
    asciidoctorExt
}
*/

group = 'sk.objectify'
java {
	toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

def versionDetails = versionDetails()
if (versionDetails.lastTag && versionDetails.isCleanTag) {
	version = extractVersionFromTag(versionDetails.lastTag, false)
	println 'Commit tagged and no uncommited changes. CREATING FINAL VERSION ' + version
} else {
	version = extractVersionFromTag(versionDetails.lastTag, true)
	println 'Commit not tagged or not all changes commited. CREATING SNAPSHOT VERSION ' + version
}

java {
	withJavadocJar()
	withSourcesJar()
}

dependencies {
	api 'org.springframework.boot:spring-boot-starter'
	api 'org.springframework.boot:spring-boot-starter-aspectj'
//    api 'org.springframework.boot:spring-boot-starter-log4j2'
    api 'org.slf4j:log4j-over-slf4j'
	api 'org.springframework.boot:spring-boot-starter-integration'
	api 'org.springframework.integration:spring-integration-jdbc'
	api 'org.springframework.integration:spring-integration-http'
	api 'org.springframework.boot:spring-boot-starter-data-jdbc'
	api 'org.springframework.boot:spring-boot-starter-validation'
	api 'org.springframework.boot:spring-boot-starter-mail'
	api 'org.springframework.boot:spring-boot-starter-thymeleaf'
	api 'org.springframework.boot:spring-boot-starter-webmvc'
	api 'org.springframework.boot:spring-boot-starter-actuator'
	api 'org.springframework.boot:spring-boot-starter-security'
	api 'org.springframework.boot:spring-boot-starter-restclient'
	// Preserve existing JSON contracts and stored message payloads during the platform upgrade.
	api 'org.springframework.boot:spring-boot-jackson2'
	api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	api 'org.junit.jupiter:junit-jupiter-api'
	api 'org.springframework:spring-test'

	api 'com.google.guava:guava:33.7.2-jre'
	api 'com.google.firebase:firebase-admin:9.11.0'

	api 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	api 'org.apache.commons:commons-email2-jakarta:2.0.0-M1'
	api 'org.apache.commons:commons-lang3'
	api 'org.apache.commons:commons-text:1.15.0'
	api 'commons-codec:commons-codec'

	api 'org.jsoup:jsoup:1.23.2'

	api 'io.rest-assured:json-schema-validator:6.0.1'
	api 'org.assertj:assertj-core'

	api 'org.postgresql:postgresql'
	api 'org.springframework.boot:spring-boot-starter-flyway'
	api 'org.flywaydb:flyway-database-postgresql'

	api 'com.icegreen:greenmail:2.1.14'
	api 'com.icegreen:greenmail-junit5:2.1.14'
	
	api 'org.awaitility:awaitility'

	api 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	api 'com.jayway.jsonpath:json-path'

	api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-restdocs'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.integration:spring-integration-test'
	testImplementation 'junit:junit'


	testImplementation 'commons-jxpath:commons-jxpath:1.4.0'
	testImplementation 'io.rest-assured:rest-assured:6.0.1'
	testImplementation 'io.rest-assured:json-path:6.0.1'
	testImplementation 'io.rest-assured:xml-path:6.0.1'
	testImplementation 'io.rest-assured:rest-assured-common:6.0.1'
	testImplementation 'io.rest-assured:spring-mock-mvc:6.0.1'
	testImplementation 'commons-jxpath:commons-jxpath:1.4.0'
	
	api 'org.springframework.restdocs:spring-restdocs-mockmvc' // used in testUtils in src.main	
